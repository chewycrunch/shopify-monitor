version: '3'

# Nothing else reads .env: Go has no notion of it, and Task only loads it when
# told to. A missing file is not an error, and the real environment still wins,
# so `MONITOR_LOG_FORMAT=json task run` overrides what is in here.
dotenv: ['.env']

vars:
  GOPATH:
    sh: go env GOPATH
  GOLANGCI: '{{.GOPATH}}/bin/golangci-lint'
  OWNER: chewycrunch
  REGISTRY: ghcr.io
  IMAGE: shopify-monitor
  REPO: '{{.REGISTRY}}/{{.OWNER}}/{{.IMAGE}}'
  GOLANGCI_VERSION: v2.12.2
  PLATFORMS: linux/amd64,linux/arm64
  BUILD:
    sh: git rev-parse --short HEAD

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  hooks:
    desc: Point git at the versioned pre-commit hook in .githooks/
    cmds:
      - git config core.hooksPath .githooks
      - chmod +x .githooks/*

  init:
    desc: Seed config/ from the example templates, leaving any existing files alone
    # Deliberately not `cp -n`: BSD and GNU disagree on its exit status when it
    # skips, so an existing config would either fail the task or need `|| true`
    # papering over a real error.
    cmds:
      - for f in websites.csv proxies.txt; do [ -f "config/$f" ] || cp "config/example.$f" "config/$f"; done
      - echo "config/ ready — add your stores to config/websites.csv"

  run:
    desc: Run against config/ without building an image
    cmds:
      - go run main.go

  tools:
    desc: Install golangci-lint
    # Binary install, per golangci-lint's own guidance: go install and tool
    # directives are not guaranteed to produce a working binary.
    cmds:
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b {{.GOPATH}}/bin {{.GOLANGCI_VERSION}}

  fmt:
    desc: Format all Go files
    cmds:
      - '{{.GOLANGCI}} fmt ./...'

  lint:
    desc: Run the linter
    cmds:
      - '{{.GOLANGCI}} run ./...'

  tidy:
    desc: Check that go.mod and go.sum still match the source
    cmds:
      - go mod tidy -diff

  check:
    desc: Everything the pre-commit hook runs — formatting, go.mod, and the linter
    # Verifies rather than rewrites, so this is safe to run anywhere; `task fmt`
    # is the one that edits files.
    cmds:
      - '{{.GOLANGCI}} fmt --diff ./...'
      - task: tidy
      - task: lint

  login:
    desc: Authenticate Docker against GHCR
    # Reuses the gh CLI's token rather than a separate PAT. Needs the
    # write:packages scope: `gh auth refresh -s write:packages` if it is missing.
    cmds:
      - gh auth token | docker login {{.REGISTRY}} -u {{.OWNER}} --password-stdin

  build:
    desc: Build the image for this machine only, for running locally
    # Single-platform and loaded into the local image store, which a multi-
    # platform build cannot be. Use `deploy` for anything europa will run.
    cmds:
      - docker build --build-arg BUILD={{.BUILD}} -t {{.IMAGE}}:{{.BUILD}} -t {{.IMAGE}}:latest .

  release:
    desc: Build every architecture and push to GHCR by hand
    # Normally CI does this on every push to main; this is the escape hatch for
    # when you need an image out without going through main.
    # buildx builds and pushes in one step: a multi-platform result is a manifest
    # list, which the local image store cannot hold, so there is nothing to tag
    # and push separately.
    cmds:
      - >-
        docker buildx build
        --platform {{.PLATFORMS}}
        --build-arg BUILD={{.BUILD}}
        -t {{.REPO}}:sha-{{.BUILD}}
        -t {{.REPO}}:latest
        --push .

  verify:
    desc: Report which architectures the pushed image supports
    cmds:
      - docker buildx imagetools inspect {{.REPO}}:latest

  promote:
    desc: Point a version tag at an already-built image (VERSION=v1.2.3 SHA=abc1234)
    # The same retag the release workflow performs, for doing it from a laptop.
    # Copies the existing manifest list, so it never rebuilds. Strips the v the
    # same way CI does, so VERSION=v1.2.3 and VERSION=1.2.3 both publish 1.2.3.
    requires:
      vars: [VERSION, SHA]
    cmds:
      - |
        V="{{.VERSION}}"; V="${V#v}"
        docker buildx imagetools create --tag {{.REPO}}:"$V" {{.REPO}}:sha-{{.SHA}}
        docker buildx imagetools inspect {{.REPO}}:"$V"

  deploy:
    desc: Log in, then build and push every architecture
    cmds:
      - task: login
      - task: release
      - task: verify
