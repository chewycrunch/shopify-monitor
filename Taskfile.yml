version: '3'

vars:
  GOPATH:
    sh: go env GOPATH
  GOLANGCI: '{{.GOPATH}}/bin/golangci-lint'
  ACCOUNT: '794038239303'
  REGION: us-east-1
  REGISTRY: '{{.ACCOUNT}}.dkr.ecr.{{.REGION}}.amazonaws.com'
  IMAGE: shopify-monitor
  GOLANGCI_VERSION: v2.12.2
  PLATFORMS: linux/amd64,linux/arm64
  BUILD:
    sh: git rev-parse --short HEAD

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  hooks:
    desc: Point git at the versioned pre-commit hook in .githooks/
    cmds:
      - git config core.hooksPath .githooks
      - chmod +x .githooks/*

  tools:
    desc: Install golangci-lint
    # Binary install, per golangci-lint's own guidance: go install and tool
    # directives are not guaranteed to produce a working binary.
    cmds:
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b {{.GOPATH}}/bin {{.GOLANGCI_VERSION}}

  fmt:
    desc: Format all Go files
    cmds:
      - '{{.GOLANGCI}} fmt ./...'

  lint:
    desc: Run the linter
    cmds:
      - '{{.GOLANGCI}} run ./...'

  tidy:
    desc: Check that go.mod and go.sum still match the source
    cmds:
      - go mod tidy -diff

  check:
    desc: Everything the pre-commit hook runs — formatting, go.mod, and the linter
    # Verifies rather than rewrites, so this is safe to run anywhere; `task fmt`
    # is the one that edits files.
    cmds:
      - '{{.GOLANGCI}} fmt --diff ./...'
      - task: tidy
      - task: lint

  login:
    desc: Authenticate Docker against ECR
    cmds:
      - aws ecr get-login-password --region {{.REGION}} --profile personal | docker login --username AWS --password-stdin {{.REGISTRY}}

  build:
    desc: Build the image for this machine only, for running locally
    # Single-platform and loaded into the local image store, which a multi-
    # platform build cannot be. Use `deploy` for anything europa will run.
    cmds:
      - docker build --build-arg BUILD={{.BUILD}} -t {{.IMAGE}}:{{.BUILD}} -t {{.IMAGE}}:latest .

  release:
    desc: Build for every deployed architecture and push to ECR
    # buildx builds and pushes in one step: a multi-platform result is a manifest
    # list, which the local image store cannot hold, so there is nothing to tag
    # and push separately.
    cmds:
      - >-
        docker buildx build
        --platform {{.PLATFORMS}}
        --build-arg BUILD={{.BUILD}}
        -t {{.REGISTRY}}/{{.IMAGE}}:{{.BUILD}}
        -t {{.REGISTRY}}/{{.IMAGE}}:latest
        --push .

  verify:
    desc: Report which architectures the pushed image supports
    cmds:
      - docker buildx imagetools inspect {{.REGISTRY}}/{{.IMAGE}}:latest

  deploy:
    desc: Log in, then build and push every architecture
    cmds:
      - task: login
      - task: release
      - task: verify
