name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No checkout and no rebuild: this copies the manifest list that main
      # already built and tested, so :v1.2.3 is the exact bits that ran as
      # :latest, multi-arch intact. Rebuilding from the tag would produce a
      # different image from the same source.
      - name: Point the version tag at the image built for this commit
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SRC="$IMAGE:sha-${GITHUB_SHA:0:7}"

          if ! docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then
            echo "::error::$SRC not found in the registry."
            echo "::error::Tag a commit that has been built on main — a commit that never landed there has no image to promote."
            exit 1
          fi

          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$SRC"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
