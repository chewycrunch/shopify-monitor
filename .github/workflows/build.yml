name: build

on:
  push:
    branches: [main]

# A newer push to main makes the in-flight image obsolete, so let it cancel.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The builder stage is native and Go cross-compiles (see BUILDPLATFORM in
      # the Dockerfile), so QEMU is here only for the runtime stage's `apk add`
      # on the non-host architecture.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computed once here rather than left to metadata-action's own shortening,
      # so the tag written here and the tag release.yml looks for cannot drift.
      - id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # No :latest here — that now tracks releases, not main. :edge keeps a
          # stable name for "newest build off main" so the convenience is not lost.
          tags: |
            type=raw,value=edge
            type=raw,value=sha-${{ steps.sha.outputs.short }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD=${{ steps.sha.outputs.short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
